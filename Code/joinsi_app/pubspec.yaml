name: joinsi
description: JoinSi by HOMESI - SiPartner recruiting business app (high-fidelity prototype)
publish_to: 'none'
version: 0.1.0+1

environment:
  # CardThemeData como tipo de ThemeData.cardTheme exige la normalizacion
  # de component themes => Flutter >=3.29 (Dart 3.7).
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  # Foto real como carita del LO (Android Photo Picker, sin permisos extra)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/video/
    - assets/audio/
