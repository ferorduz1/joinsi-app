name: Build JoinSi APK

# Arranca solo al hacer push a main (o manualmente desde la pestana Actions).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# contents: write es necesario para que el GITHUB_TOKEN automatico pueda
# publicar/actualizar el Release "apk-latest" mas abajo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code/joinsi_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21, no 17: el andamiaje que genera el Flutter stable de nov-2026 trae
      # un Android lint que llama List.removeLast() (API de Java 21). Con JDK 17
      # el build muere en :image_picker_android:lintVitalAnalyzeRelease.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter (stable, Dart >=3.7)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # El repo versiona SOLO lib/, test/, assets/ y pubspec.yaml.
      # Las carpetas nativas se generan aqui. flutter create puede pisar
      # lib/main.dart, asi que respaldamos y restauramos lib/ tal cual.
      - name: Generate Android scaffold
        run: |
          cp -r lib "$RUNNER_TEMP/joinsi_lib_backup"
          flutter create --platforms=android --project-name joinsi --org com.homesi .
          rm -rf lib
          cp -r "$RUNNER_TEMP/joinsi_lib_backup" lib

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK (artifact interno de Actions, requiere login GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: joinsi-app-release
          path: Code/joinsi_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Publica el mismo APK como asset de un Release publico de tag fijo
      # "apk-latest". En un repo publico esto SI se descarga con un link
      # directo desde el celular, sin login de GitHub y sin descomprimir --
      # a diferencia del artifact de arriba. Se sobre-escribe en cada build,
      # asi que el link de abajo siempre apunta al ultimo main.
      - name: Publish as public Release (descarga directa sin login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: JoinSi APK (build automatico)
          body: |
            APK generado automaticamente desde el commit ${{ github.sha }}.
            Este link siempre apunta al build mas reciente de main:
            https://github.com/${{ github.repository }}/releases/download/apk-latest/app-release.apk
          files: Code/joinsi_app/build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
